<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VendorBridge - Enterprise ERP</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="loading-screen" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <div class="erp-shell">
    <aside class="erp-sidebar">
      <a href="/dashboard.html" class="erp-brand">
        <span class="brand-icon">&gt;_</span>
        <span>VendorBridge</span>
        <small>Enterprise ERP</small>
      </a>
      <nav id="module-nav" class="module-nav"></nav>
      <div class="sidebar-user">
        <div id="user-avatar" class="avatar-init">VB</div>
        <div>
          <strong id="user-display-name">Loading User...</strong>
          <span id="user-display-role">Role Loading...</span>
        </div>
      </div>
    </aside>

    <main class="erp-main">
      <header class="erp-topbar">
        <input id="global-search" class="erp-search" type="search" placeholder="Search vendors, RFQs, invoices, or logs...">
        <div class="topbar-actions">
          <span id="db-conn-badge" class="status-pill">Checking DB</span>
          <button id="refresh-btn" class="btn-outline" type="button">Refresh</button>
          <button id="logout-btn" class="btn-outline" type="button">Log Out</button>
        </div>
      </header>

      <section id="alert-container" class="erp-alerts"></section>
      <section id="workspace" class="erp-workspace"></section>
    </main>
  </div>

  <template id="empty-template">
    <div class="empty-state">
      <strong>No records yet</strong>
      <span>Create the first record to begin the procurement workflow.</span>
    </div>
  </template>

  <script src="/js/dashboard.js"></script>
</body>
</html>
