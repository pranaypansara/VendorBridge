<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VendorBridge - Registration</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="reg-wrapper">
    <div class="reg-card">
      <!-- Left Info Section -->
      <div class="reg-left">
        <a href="/" class="brand">
          <div class="brand-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
              <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
              <polyline points="9 13 12 16 16 11" stroke="#3b82f6" stroke-width="2.5"></polyline>
            </svg>
          </div>
          VendorBridge
        </a>

        <div class="intro-content">
          <h1 class="intro-title">Registration</h1>
          <p class="intro-subtitle">
            Access your enterprise dashboard and manage your procurement workflow with surgical precision.
          </p>
        </div>

        <!-- Trusted Badge Card -->
        <div class="trusted-block">
          <div class="trusted-left">
            <div class="avatar-group">
              <div class="avatar" style="background-color: #334155;"></div>
              <div class="avatar" style="background-color: #475569;"></div>
              <div class="avatar" style="background-color: #1e293b;"></div>
            </div>
            <span class="trusted-text">Trusted by 500+ Enterprises</span>
          </div>
          <div class="trusted-badges">
            <!-- Shield icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <!-- Key lock icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <!-- Verified icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: #10b981;">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          </div>
        </div>
      </div>


      <!-- Right Form Section -->
      <div class="reg-right">
        <p class="form-subtitle" style="margin-bottom: 2rem;">Complete the form below to register for access.</p>

        <div id="alert-container"></div>

        <form id="register-form">
          <div class="form-grid">
            <div class="form-group">
              <label for="first_name">First Name</label>
              <input type="text" id="first_name" name="first_name" class="form-input" placeholder="John" required>
            </div>
            
            <div class="form-group">
              <label for="last_name">Last Name</label>
              <input type="text" id="last_name" name="last_name" class="form-input" placeholder="Doe" required>
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" class="form-input" placeholder="j.doe@enterprise.com" required autocomplete="email">
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" class="form-input" placeholder="+1 (555) 000-0000" required autocomplete="tel">
            </div>

            <div class="form-group">
              <label for="role">Role (Admin, officer)</label>
              <select id="role" name="role" class="form-input-dark" required>
                <option value="" disabled selected>Select your role</option>
                <option value="Admin">Admin</option>
                <option value="Procurement Officer">Procurement Officer</option>
                <option value="Manager">Manager</option>
                <option value="Vendor">Vendor</option>
              </select>
            </div>


            <div class="form-group">
              <label for="country">Country</label>
              <input type="text" id="country" name="country" class="form-input" placeholder="United States" required>
            </div>

            <div class="form-group form-group-full">
              <label for="password">Password</label>
              <div class="input-wrapper">
                <input type="password" id="password" name="password" class="form-input" placeholder="Enter secure password" required autocomplete="new-password">
                <button type="button" id="toggle-password" class="password-toggle" aria-label="Toggle password visibility">
                  <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="agree" name="agree" class="checkbox-input" required>
            <label for="agree" class="checkbox-label">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
          </div>

          <button type="submit" class="btn">Register</button>
        </form>

        <div class="divider"></div>

        <div class="form-footer">
          Already have an account? <a href="/login.html">Sign In</a>
        </div>


      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
